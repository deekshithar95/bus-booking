services:

  mysql:
    image: mysql:8.0
    container_name: bus-booking-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bus_booking
      MYSQL_USER: bususer
      MYSQL_PASSWORD: buspassword

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "bususer",
          "-pbuspassword"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile

    container_name: bus-booking-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bususer
      DB_PASSWORD: buspassword
      DB_NAME: bus_booking

      JWT_SECRET: change-this-secret


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: bus-booking-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_started

    ports:
      - "80:80"


volumes:
  mysql_data: